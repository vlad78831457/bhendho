[project]
name = "department-example"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["offgrid-worker>=0.1"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.7"]

[project.scripts]
department-worker = "department.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/department"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
strict = true
