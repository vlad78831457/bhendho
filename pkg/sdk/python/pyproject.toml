[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "offgrid-worker"
version = "0.1.0"
description = "Python SDK for OFFGRID workers (prorabs): gateway client and worker runtime"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.51,<2"]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.23",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/offgrid_worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: runs against a live OFFGRID core (needs CORE_URL and WORKER_TOKEN)"]
addopts = "-m 'not e2e'"

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["openai.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
